# We have a conf and classes directory, add to BBPATH
BBPATH =. "${LAYERDIR}:"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*.bb \
            ${LAYERDIR}/recipes-*/*.bbappend"

BBFILE_COLLECTIONS += "xcpng"
BBFILE_PATTERN_xcpng = "^${LAYERDIR}/"
BBFILE_PRIORITY_xcpng = "5"

LAYERSERIES_COMPAT_xcpng = "alma10"

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_xcpng = "1"

LAYERDEPENDS_xcpng = "dnf-bridge"


# Activate sstate support
INHERIT = "sstate"

# FIXME those should rather be pulled by build-env
HOSTTOOLS += " \
    podman \
    newgidmap newuidmap pasta slirp4netns \
    createrepo_c \
    curl \
"

# Tools needed for XCP-ng sprm repository layout
HOSTTOOLS += "git-lfs"

# Configuration for podman
CONTAINER_ARCH ?= "unset"
CONTAINER_ARCH:x86_64 = "linux/amd64"
CONTAINER_ARCH:x86_64_v2 = "linux/amd64/v2"
CONTAINER_ARCH:aarch64 = "linux/aarch64"

# Use our kernel packages over Alma's
PREFERRED_PROVIDER_rpm/kernel-headers = "kernel-xcpng"
PREFERRED_RPROVIDER_kernel-headers = "kernel-xcpng"
PREFERRED_PROVIDER_rpm/kernel-devel = "kernel-xcpng"
PREFERRED_RPROVIDER_kernel-devel = "kernel-xcpng"
PREFERRED_RPROVIDER_perf = "kernel-xcpng"

# RPM macros necessary for parsing (some) specfiles
# FIXME find a way to check for consistency with RPMs
RPM_MACROS = " \
  python3_pkgversion=3 \
  xcpng=9 \
  xenserver=9 \
"

# # FIXME: this is needed by kernel-lp, but should include %autorev to be
# # precise enough, and for some reason xen-lp does not need it
# RPM_MACROS:append = " \
#   dist=.xcpng8.99 \
# "
